services:
  servico-coordenador:
    build: ./servico-coordenador
    container_name: servico-coordenador
    ports:
      - "3000:3000"

  servico-agendamento:
    build: ./servico-agendamento
    container_name: servico-agendamento
    ports:
      - "5000:5000"
    environment:
      # dentro da rede do compose o flask acha o node pelo nome do servico
      - COORDENADOR_URL=http://servico-coordenador:3000
      - USAR_LOCK=true
    depends_on:
      - servico-coordenador
